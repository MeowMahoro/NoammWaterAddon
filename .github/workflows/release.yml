name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The addon compiles against an unremapped NoammAddons jar, which upstream only
      # produces as a build output, so it has to be built here first.
      - name: Build NoammAddons (dependency)
        run: |
          git clone --depth 1 --branch 26.3 https://github.com/Noamm9/NoammAddons.git /tmp/noammaddons
          cd /tmp/noammaddons
          chmod +x gradlew
          ./gradlew build -x test --console=plain

      - name: Provide dependency jar
        run: |
          mkdir -p libs
          cp /tmp/noammaddons/build/tmp/intermediateJars/*-dev.jar libs/NoammAddons-dev.jar
          ls -l libs

      - name: Build addon
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoammWaterAddon
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
